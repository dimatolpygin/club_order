<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Админка 11:11 / Фокус.Энергия</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">11:11</span>
      <span class="brand-sub">Фокус.Энергия</span>
    </div>
    <h1 class="login-title">Вход в админ-панель</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="form">
      <label class="field">
        <span class="field-label">Логин</span>
        <input class="input" type="text" name="login" autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span class="field-label">Пароль</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
