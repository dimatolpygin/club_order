<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админка{% endblock %} · 11:11 / Фокус.Энергия</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">11:11</span>
      <span class="brand-sub">Фокус.Энергия</span>
    </div>

    <nav class="nav">
      <a class="nav-item {% if active == 'dashboard' %}is-active{% endif %}" href="/">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Дашборд · Статистика
      </a>
      <a class="nav-item {% if active == 'events' %}is-active{% endif %}" href="/events">
        <svg viewBox="0 0 24 24" class="ico"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
        Мероприятия
      </a>
      <a class="nav-item {% if active == 'tickets' %}is-active{% endif %}" href="/tickets">
        <svg viewBox="0 0 24 24" class="ico"><path d="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4zm-9 7.5h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>
        Билеты
      </a>
      <a class="nav-item {% if active == 'subscriptions' %}is-active{% endif %}" href="/subscriptions">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
        Подписки
      </a>
      <a class="nav-item {% if active == 'tariffs' %}is-active{% endif %}" href="/tariffs">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 6a3 3 0 0 1 3-3h7l8 8-10 10-8-8V6zm4 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
        Тарифы
      </a>
      <a class="nav-item {% if active == 'promos' %}is-active{% endif %}" href="/promos">
        <svg viewBox="0 0 24 24" class="ico"><path d="M21.41 11.58 12.41 2.58A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 .59 1.42l9 9a2 2 0 0 0 2.83 0l7-7a2 2 0 0 0 0-2.84zM6.5 8A1.5 1.5 0 1 1 8 6.5 1.5 1.5 0 0 1 6.5 8z"/></svg>
        Промокоды
      </a>
      <a class="nav-item {% if active == 'referral' %}is-active{% endif %}" href="/referral">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 21s-7-4.5-9-9a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c-2 4.5-9 9-9 9z"/></svg>
        Реферальная программа
      </a>
      <a class="nav-item {% if active == 'broadcasts' %}is-active{% endif %}" href="/broadcasts">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 11l18-8-8 18-2-7-8-3zm9 1 5-5"/></svg>
        Рассылка
      </a>
      <a class="nav-item {% if active == 'screens' %}is-active{% endif %}" href="/screens">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-6l1 2h2v2H7v-2h2l1-2H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v9h14V6H5z"/></svg>
        Экраны бота
      </a>
      <a class="nav-item {% if active == 'settings' %}is-active{% endif %}" href="/settings">
        <svg viewBox="0 0 24 24" class="ico"><path d="M19.14 12.94a7.49 7.49 0 0 0 .05-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.49 7.49 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
        Настройки
      </a>
    </nav>

    <div class="nav-bottom">
      <a class="nav-item {% if active == 'password' %}is-active{% endif %}" href="/password">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11V11.99z"/></svg>
        Сменить пароль
      </a>
      <form method="post" action="/logout" class="logout-form">
        <button class="nav-item nav-logout" type="submit">
          <svg viewBox="0 0 24 24" class="ico"><path d="M16 17v-3H9v-4h7V7l5 5-5 5zM14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
          Выйти
        </button>
      </form>
      <div class="who">Вы вошли как <b>{{ admin.login }}</b></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
</body>
</html>
