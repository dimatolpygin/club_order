<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админка{% endblock %} · 11:11 / Фокус.Энергия</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">11:11</span>
      <span class="brand-sub">Фокус.Энергия</span>
    </div>

    <nav class="nav">
      <a class="nav-item {% if active == 'dashboard' %}is-active{% endif %}" href="/">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Дашборд
      </a>
      <a class="nav-item {% if active == 'events' %}is-active{% endif %}" href="/events">
        <svg viewBox="0 0 24 24" class="ico"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
        Мероприятия
      </a>
      <span class="nav-item is-soon">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
        Подписки <em class="soon">скоро</em>
      </span>
      <span class="nav-item is-soon">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 21s-7-4.5-9-9a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c-2 4.5-9 9-9 9z"/></svg>
        Реферальная программа <em class="soon">скоро</em>
      </span>
      <span class="nav-item is-soon">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 20h16v2H2V2h2v18zm3-3v-6h3v6H7zm5 0V7h3v10h-3zm5 0v-3h3v3h-3z"/></svg>
        Статистика <em class="soon">скоро</em>
      </span>
      <span class="nav-item is-soon">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 5h16v3H4V5zm0 5.5h16v3H4v-3zM4 16h16v3H4v-3z"/></svg>
        Кнопки меню <em class="soon">скоро</em>
      </span>
    </nav>

    <div class="nav-bottom">
      <a class="nav-item {% if active == 'password' %}is-active{% endif %}" href="/password">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11V11.99z"/></svg>
        Сменить пароль
      </a>
      <form method="post" action="/logout" class="logout-form">
        <button class="nav-item nav-logout" type="submit">
          <svg viewBox="0 0 24 24" class="ico"><path d="M16 17v-3H9v-4h7V7l5 5-5 5zM14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
          Выйти
        </button>
      </form>
      <div class="who">Вы вошли как <b>{{ admin.login }}</b></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
</body>
</html>
