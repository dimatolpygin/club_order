{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block heading %}Смена пароля{% endblock %}
{% block content %}

<div class="panel panel-narrow">
  {% if ok %}
  <div class="alert alert-ok">Пароль изменён. В следующий раз входите с новым паролем.</div>
  {% endif %}
  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/password" class="form">
    <label class="field">
      <span class="field-label">Текущий пароль</span>
      <input class="input" type="password" name="current" autocomplete="current-password" required>
    </label>
    <label class="field">
      <span class="field-label">Новый пароль</span>
      <input class="input" type="password" name="new1" autocomplete="new-password" minlength="6" required>
      <span class="field-hint">Минимум 6 символов.</span>
    </label>
    <label class="field">
      <span class="field-label">Повторите новый пароль</span>
      <input class="input" type="password" name="new2" autocomplete="new-password" minlength="6" required>
    </label>
    <button class="btn btn-primary" type="submit">Сохранить новый пароль</button>
  </form>
</div>

{% endblock %}
