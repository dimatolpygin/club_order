# Nginx-конфиг веб-админки клуба «11:11» / «Фокус.Энергия».
# Проксирует https://admin.agat-key.ru на admin-контейнер (127.0.0.1:8011).
#
# Установка на сервере (Ubuntu, системный Nginx):
#   1) cp deploy/nginx/admin.agat-key.ru.conf /etc/nginx/sites-available/admin.agat-key.ru
#   2) ln -sf /etc/nginx/sites-available/admin.agat-key.ru /etc/nginx/sites-enabled/
#   3) nginx -t && systemctl reload nginx
#   4) certbot --nginx -d admin.agat-key.ru   # допишет 443-блок + редирект и выпустит сертификат
#
# До запуска certbot активен только HTTP-блок ниже (нужен и для ACME-проверки).

server {
    listen 80;
    listen [::]:80;
    server_name admin.agat-key.ru;

    # Загрузка фото в рассылке — поднимаем лимит тела запроса.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
